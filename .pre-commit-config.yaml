repos:
  # Linting and formatting (runs on every commit)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Unit tests (runs on push only — too slow for every commit)
  - repo: local
    hooks:
      - id: unit-tests
        name: Run unit tests
        entry: python -m pytest tests/ -x -q
        language: system
        pass_filenames: false
        stages: [pre-push]
