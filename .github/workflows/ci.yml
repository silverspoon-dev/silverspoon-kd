name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run on the same ref when a new commit lands.
# Saves CI minutes during active development; the cancelled run was
# about to be obsolete anyway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Defense-in-depth: this workflow only ever reads the repo contents,
# so explicitly drop the default write permissions on GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Install the dev extras so ruff is at the version pinned in
      # pyproject.toml — keeps local ``make check`` and CI in lock-step.
      - name: Install dependencies
        run: pip install -e ".[dev]"
      # Order matches local ``make check``: lint first, format second.
      - name: Check linting
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      # ``[tool.pyright].include = ["silverspoon_kd"]`` in pyproject.toml
      # already scopes the check, so no positional path argument is
      # needed (and an explicit one would silently override the include).
      - name: Type-check with pyright
        run: pyright

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Run every Python version to completion even when one fails —
      # makes it easy to spot version-specific regressions ("3.10 only"
      # vs. "3.10 + 3.12 but not 3.11" etc.).
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -v --device=cpu
