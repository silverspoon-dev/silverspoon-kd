name: Docs

# Build the Sphinx site and deploy it to GitHub Pages, which serves
# https://kd.silverspoon.dev (custom domain configured in the repository's
# Pages settings; DNS: CNAME kd -> silverspoon-dev.github.io).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; never cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only the canonical repository deploys; forks skip this workflow.
    if: github.repository == 'silverspoon-dev/silverspoon-kd'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # autodoc imports the package, so the runtime dependencies are needed
      # alongside the docs extras.
      - name: Install dependencies
        run: pip install -e ".[docs]"
      - name: Build HTML
        run: sphinx-build -b html -W --keep-going docs docs/_build/html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
